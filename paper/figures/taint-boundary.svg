<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="serif" font-size="12">
  <title>The fold and run boundary with both taint edges</title>
  <desc>Four files of one build. run-only-importer fails on its own and seeds the tainted set. A forward edge along its import taints shared-config. A backward edge along a capture taints capturing-sibling. No edge reaches independent, which folds.</desc>
  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="bwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <text x="10" y="18" font-size="13" font-weight="bold">One build, four files</text>
  <text x="10" y="34" font-size="11" fill="#555">shaded = final verdict run; unshaded = folds</text>

  <!-- seed -->
  <rect x="20" y="52" width="150" height="46" fill="#e8e8e8" stroke="#333"/>
  <text x="30" y="70">run-only-importer.ts</text>
  <text x="30" y="86" font-size="10" fill="#444">seed: early return in a body</text>
  <text x="176" y="74" font-size="10" fill="#444">F-Seed</text>

  <!-- shared-config -->
  <rect x="20" y="146" width="150" height="46" fill="#e8e8e8" stroke="#333"/>
  <text x="30" y="164">shared-config.ts</text>
  <text x="30" y="180" font-size="10" fill="#444">would fold alone</text>

  <!-- capturing sibling -->
  <rect x="300" y="146" width="160" height="46" fill="#e8e8e8" stroke="#333"/>
  <text x="310" y="164">capturing-sibling.ts</text>
  <text x="310" y="180" font-size="10" fill="#444">would fold alone</text>

  <!-- independent -->
  <rect x="300" y="240" width="160" height="46" fill="#fff" stroke="#333"/>
  <text x="310" y="258">independent.ts</text>
  <text x="310" y="274" font-size="10" fill="#444">no edge reaches it</text>

  <!-- forward edge: seed -> its import -->
  <line x1="95" y1="98" x2="95" y2="144" stroke="#333" stroke-width="1.6" marker-end="url(#fwd)"/>
  <text x="102" y="126" font-size="10">F-Succ forward</text>
  <text x="102" y="138" font-size="9" fill="#555">along the import</text>

  <!-- backward edge: shared-config -> capturer -->
  <path d="M 170 160 L 298 160" stroke="#777" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#bwd)"/>
  <text x="186" y="152" font-size="10">F-Succ backward</text>
  <text x="186" y="140" font-size="9" fill="#555">along the capture</text>

  <!-- the capture that creates the backward edge -->
  <path d="M 298 182 L 172 182" stroke="#aaa" stroke-width="1" marker-end="url(#fwd)"/>
  <text x="196" y="196" font-size="9" fill="#666">captures sharedLabels (F-Capture)</text>

  <text x="20" y="258" font-size="11" fill="#555">The capturer imports shared-config too,</text>
  <text x="20" y="272" font-size="11" fill="#555">but that edge points the other way and</text>
  <text x="20" y="286" font-size="11" fill="#555">cannot carry taint back.</text>
</svg>
