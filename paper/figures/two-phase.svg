<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" font-family="serif" font-size="12">
  <title>Reduce to envelopes, then revive</title>
  <desc>Phase one reduces source to a value tree containing symbolic envelopes and executes none of the file's own statements. Phase two resolves each envelope name through the folding file's own imports and invokes the real constructor, so one envelope survives to serialisation and the rest become real objects.</desc>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="10" y="18" font-size="13" font-weight="bold">Reduce, then revive</text>

  <rect x="16" y="40" width="130" height="86" fill="#fff" stroke="#333"/>
  <text x="26" y="58" font-size="11" font-weight="bold">source</text>
  <text x="26" y="76" font-size="10" font-family="monospace">new Bucket({…})</text>
  <text x="26" y="92" font-size="10" font-family="monospace">Sub`${b.arn}`</text>
  <text x="26" y="108" font-size="10" font-family="monospace">b.arn</text>

  <line x1="148" y1="83" x2="188" y2="83" stroke="#333" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="150" y="74" font-size="9" fill="#444">reduce</text>

  <rect x="190" y="40" width="150" height="86" fill="#f4f4f4" stroke="#333"/>
  <text x="200" y="58" font-size="11" font-weight="bold">envelopes</text>
  <text x="200" y="76" font-size="10" font-family="monospace">{__resource …}</text>
  <text x="200" y="92" font-size="10" font-family="monospace">{__intrinsic …}</text>
  <text x="200" y="108" font-size="10" font-family="monospace">{__attrRef …}</text>

  <line x1="342" y1="83" x2="382" y2="83" stroke="#333" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="340" y="74" font-size="9" fill="#444">revive</text>

  <rect x="384" y="40" width="122" height="86" fill="#fff" stroke="#333"/>
  <text x="394" y="58" font-size="11" font-weight="bold">output</text>
  <text x="394" y="76" font-size="10">real instance</text>
  <text x="394" y="92" font-size="10">real intrinsic</text>
  <text x="394" y="108" font-size="10" font-weight="bold">{__attrRef} kept</text>

  <rect x="16" y="150" width="324" height="34" fill="none" stroke="#888" stroke-dasharray="4 3"/>
  <text x="26" y="171" font-size="11">nothing of the file's own statements executes (F-NoOwnExecution)</text>

  <rect x="348" y="150" width="158" height="34" fill="none" stroke="#888" stroke-dasharray="4 3"/>
  <text x="356" y="165" font-size="10">the imported module runs,</text>
  <text x="356" y="178" font-size="10">resolved through this file</text>

  <text x="16" y="210" font-size="11" fill="#555">Five envelope kinds are revived. One, the attribute</text>
  <text x="16" y="224" font-size="11" fill="#555">reference, survives to serialisation (F-Val-Fate), because</text>
  <text x="16" y="238" font-size="11" fill="#555">the value it denotes is resolved at apply, not at build.</text>
</svg>
