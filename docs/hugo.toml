baseURL = "https://intentius.io/typescript-as-data/"
title = "typescript-as-data"
enableGitInfo = false
disableKinds = ["taxonomy", "term"]

[params]
  repo = "https://github.com/INTENTIUS/typescript-as-data"
  spec = "https://github.com/INTENTIUS/typescript-as-data/tree/main/spec"
  description = "TypeScript configuration, read as data."

# Every figure a page quotes comes from data/figures.json, written by
# scripts/figures.mjs.
[[menus.main]]
  name = "What it enables"
  pageRef = "/what-it-enables"
  weight = 10
[[menus.main]]
  name = "Try it"
  pageRef = "/try-it"
  weight = 20
[[menus.main]]
  name = "Specification"
  url = "https://github.com/INTENTIUS/typescript-as-data/tree/main/spec"
  weight = 30

[markup.goldmark.renderer]
  unsafe = true

# Highlighting emits classes, styled in site.css for both themes, rather
# than Chroma's inline dark palette.
[markup.highlight]
  noClasses = false
  lineNumbersInTable = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[minify]
  disableJSON = true
