name: publish

run-name: publish — ${{ github.ref_name }}

# Publishes @intentius/tsad-conformance and @intentius/tsad-reference to npm
# when a release tag is pushed. The tag is cut by hand after
# scripts/release-preflight.sh has confirmed the commit is on main, pushed,
# and green; this workflow runs the suite again on the tagged commit and packs,
# installs and exercises both packages from a clean directory before it
# publishes either, so a tag on a commit that would not install cannot ship.
#
# Provenance and auth come from npm's trusted publishing (id-token): both
# packages have a trusted-publisher record naming this workflow, and there is
# no NPM_TOKEN in this repository. The same shape as chant's publish workflow.
on:
  push:
    tags: ['tsad-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:prose
      - name: Package version carries the spec version
        run: |
          version=$(node -p 'require("./packages/conformance/package.json").version')
          spec=$(tr -d '[:space:]' < spec/VERSION)
          case "$version" in
            "$spec".*) echo "packages at $version carry spec $spec" ;;
            *) echo "package version $version does not carry spec version $spec" >&2; exit 1 ;;
          esac
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "tsad-v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version $version" >&2; exit 1
          fi
      - name: Pack, install into a fresh directory, and run the suite there
        run: npm run smoke:published

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          # Deliberately no registry-url: with it, setup-node writes an .npmrc
          # carrying `_authToken=${NODE_AUTH_TOKEN}`, and an empty or
          # placeholder token is sent as auth, so npm answers ENEEDAUTH
          # instead of falling through to OIDC. Without an .npmrc, npm publish
          # sees the id-token environment and exchanges it for a short-lived
          # token through the trusted-publisher record.
      - run: npm install
      # npm's OIDC helper never throws: a refused exchange falls through to a
      # bare ENEEDAUTH, which cannot tell a missing trusted-publisher record
      # from one whose workflow filename or environment does not match this
      # job. Replaying the exchange prints the registry's answer. Prints no
      # token. Lifted from chant's scripts/publish-packages.sh.
      - name: Ask the registry about the trusted-publisher records
        run: |
          idtok=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" -H "Accept: application/json" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r '.value // empty')
          [ -n "$idtok" ] || { echo "GitHub did not issue an id-token"; exit 0; }
          for name in @intentius/tsad-conformance @intentius/tsad-reference; do
            body=$(mktemp)
            status=$(curl -sS -o "$body" -w '%{http_code}' -X POST -H "Authorization: Bearer $idtok" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name//\//%2f}")
            case "$status" in
              2*) echo "$name: registry accepted the OIDC exchange (HTTP $status)" ;;
              *) echo "$name: registry refused the OIDC exchange: HTTP $status, $(jq -r '.message // .error // "no message"' "$body")" ;;
            esac
            rm -f "$body"
          done
      # conformance first: reference depends on it.
      - name: Publish @intentius/tsad-conformance
        run: npm publish --workspace packages/conformance --provenance --access public
      - name: Publish @intentius/tsad-reference
        run: npm publish --workspace packages/reference --provenance --access public
